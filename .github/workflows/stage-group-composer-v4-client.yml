name: Group Composer client checks

on:
  push:
    branches:
      - test/group-composer-v4

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate client addon
        run: |
          set -euo pipefail
          bash -n fetch-client-addons.sh
          bash -n install-group-composer-wsl.sh
          find client-addons-src/GroupComposer -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          luac5.1 -p client-addons-src/GearAdvisor/GearAdvisor.lua
          luac5.1 -p client-addons-src/WoWSimsBridge/WoWSimsBridge.lua
          grep -q '^## Interface: 30300$' client-addons-src/WoWSimsBridge/WoWSimsBridge.toc
          ! grep -Eq 'C_(Container|Item|SpecializationInfo|Timer)' client-addons-src/WoWSimsBridge/WoWSimsBridge.lua
          python3 -m json.tool data/wowsims/sources.json >/dev/null
          grep -q 'NoM0Re/WeakAuras-WotLK/releases/download/5.22.0-b3706bd4/WeakAuras2.zip' fetch-client-addons.sh
          grep -q '83f620454d221440df10faa0d52ba704b4cc53aed5ee94010e35eae37c008175' fetch-client-addons.sh
          grep -q '5Buttons/Details-WotLK.git|a237261866afaed8c0faf751d682c5d1fcae399d' fetch-client-addons.sh
          ! grep -q 'Bunny67/WeakAuras-WotLK' fetch-client-addons.sh
          grep -q 'WARRIOR = {' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'DEATHKNIGHT = {' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'DRUID = {' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'Marksmanship' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'Equipped iLvl' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'PANEL_WIDTH = 390' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'SetClampedToScreen' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'rightSpace >= PANEL_WIDTH + 8 or rightSpace >= leftSpace' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -Fq '## Version: 0.3.3' client-addons-src/GearAdvisor/GearAdvisor.toc
          grep -q 'PANEL_HEIGHT = 638' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'eraNotice:SetHeight(34)' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'notesText:SetHeight(72)' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'WoWSims upgrade authority' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -Fq 'value:SetPoint("TOPRIGHT", -24, -370 - (i - 1) * 18)' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'is the upgrade authority for' client-addons-src/GearAdvisor/GearAdvisor.lua
          ! grep -q 'priorityText:SetText(profile.priority)' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'WoWSimsBridge.Open("character")' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'GearAdvisor335SimBagsButton' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -Fq 'SendChatMessage(".wowsims simbags", "SAY")' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'CHAT_MSG_SYSTEM' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'SIM_BACKED' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'UNVALIDATED GAIN' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'SIMSTALE' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q 'www.wowsims.com/classic/' client-addons-src/WoWSimsBridge/WoWSimsBridge.lua
          grep -q 'www.wowsims.com/tbc/' client-addons-src/WoWSimsBridge/WoWSimsBridge.lua
          grep -q 'www.wowsims.com/wotlk/' client-addons-src/WoWSimsBridge/WoWSimsBridge.lua
          grep -q 'BuildCharacterExport' client-addons-src/WoWSimsBridge/WoWSimsBridge.lua
          grep -q 'BuildBagExport' client-addons-src/WoWSimsBridge/WoWSimsBridge.lua
          grep -q 'version = "v3.2.4"' client-addons-src/WoWSimsBridge/WoWSimsBridge.lua
          grep -q '"release": "v3.2.4"' data/wowsims/sources.json
          grep -q 'static scores do not decide upgrades' client-addons-src/WoWSimsBridge/WoWSimsBridge.lua
          grep -q 'for i = 1, 7 do' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -q '1260' client-addons-src/GearAdvisor/GearAdvisor.lua
          grep -Fq 'label.SetPoint("LEFT", frame, "LEFT", 8, 0)' client-ui/src/widgets/Button.ts
          grep -Fq 'height: 88' client-ui/src/components/ActivityBrowser.ts
          grep -Fq 'tag.SetHeight(28)' client-ui/src/components/ActivityBrowser.ts
          grep -Fq 'row * 96' client-ui/src/components/ActivityBrowser.ts
          grep -Fq 'subtitle.SetWidth(900)' client-ui/src/components/RecommendationsPage.ts
          grep -Fq 'panel.frame.SetSize(1228, 228)' client-ui/src/components/RecommendationsPage.ts
          grep -Fq 'rows.length * 236' client-ui/src/components/RecommendationsPage.ts
          grep -Fq 'height = 88' client-addons-src/GroupComposer/GroupComposerModernUI.lua
          grep -Fq 'tag:SetHeight(28)' client-addons-src/GroupComposer/GroupComposerModernUI.lua
          grep -Fq 'panel.frame:SetSize(1228, 228)' client-addons-src/GroupComposer/GroupComposerModernUI.lua
          lua5.1 client-addons-src/GroupComposer/tests/test_data_profiles.lua
          python3 client-addons-src/GroupComposer/tests/test_server_contract.py
          python3 client-addons-src/GroupComposer/tests/test_titan_bridge_contract.py

          # During the migration the checked-in generated bundle may appear one bot commit
          # after the TypeScript source commit. Once the new shell is activated in the TOC,
          # require that generated output to exist and parse cleanly.
          if grep -Fxq 'GroupComposerModernUI.lua' client-addons-src/GroupComposer/GroupComposer.toc; then
            test -f client-addons-src/GroupComposer/GroupComposerModernUI.lua
            luac5.1 -p client-addons-src/GroupComposer/GroupComposerModernUI.lua
            ! grep -q '^DashboardV4.lua$' client-addons-src/GroupComposer/GroupComposer.toc
          fi

          ! grep -R 'SetShown(' client-addons-src/GroupComposer --include='*.lua'
          git diff --check
