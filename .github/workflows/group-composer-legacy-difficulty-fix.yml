name: One-shot Group Composer legacy raid difficulty fix

on:
  push:
    branches:
      - feature/group-composer-audit
    paths:
      - .github/workflows/group-composer-legacy-difficulty-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/group-composer-audit
      - name: Fix legacy raid difficulty semantics
        shell: python
        run: |
          from pathlib import Path

          command = Path('modules/mod-raid-roster/src/GroupComposerCommand.cpp')
          text = command.read_text()
          marker = '''uint32 DungeonMapId(std::string const& activity)
          '''
          helper = '''bool UsesWrathRaidDifficulty(std::string const& activity)
          {
              // Wrath introduced the 10/25-player raid difficulty split used by Group::SetRaidDifficulty.
              // TBC/Classic raids use the legacy regular raid difficulty even when their roster size is 25/40.
              static std::unordered_set<std::string> const raids = {
                  "naxxramas", "obsidian_sanctum", "eye_of_eternity", "ulduar", "trial_crusader",
                  "onyxia", "vault_archavon", "icecrown", "ruby_sanctum"
              };
              return raids.count(activity) != 0;
          }

          uint32 DungeonMapId(std::string const& activity)
          '''
          if marker not in text:
              raise SystemExit('DungeonMapId marker not found')
          text = text.replace(marker, helper, 1)

          old = '''    if (plan.config.mode == "raid")
              {
                  if (plan.config.size == 10)
                      group->SetRaidDifficulty(plan.config.difficulty == "heroic" ? RAID_DIFFICULTY_10MAN_HEROIC : RAID_DIFFICULTY_10MAN_NORMAL);
                  else if (plan.config.size == 25)
                      group->SetRaidDifficulty(plan.config.difficulty == "heroic" ? RAID_DIFFICULTY_25MAN_HEROIC : RAID_DIFFICULTY_25MAN_NORMAL);
              }
              else
          '''
          new = '''    if (plan.config.mode == "raid")
              {
                  if (!UsesWrathRaidDifficulty(plan.config.activity))
                  {
                      // Classic/TBC raids have one regular instance difficulty. Their 20/25/40-player
                      // roster size must not leak a previous Wrath 25/Heroic difficulty into the live group.
                      group->SetRaidDifficulty(RAID_DIFFICULTY_10MAN_NORMAL);
                  }
                  else if (plan.config.size == 10)
                      group->SetRaidDifficulty(plan.config.difficulty == "heroic" ? RAID_DIFFICULTY_10MAN_HEROIC : RAID_DIFFICULTY_10MAN_NORMAL);
                  else if (plan.config.size == 25)
                      group->SetRaidDifficulty(plan.config.difficulty == "heroic" ? RAID_DIFFICULTY_25MAN_HEROIC : RAID_DIFFICULTY_25MAN_NORMAL);
              }
              else
          '''
          if old not in text:
              raise SystemExit('ApplyGroupSettings block not found')
          command.write_text(text.replace(old, new, 1))

          data = Path('client-addons-src/GroupComposer/Data.lua')
          data_text = data.read_text()
          if 'D.VERSION = "0.2.0"' not in data_text:
              raise SystemExit('Expected data version marker not found')
          data.write_text(data_text.replace('D.VERSION = "0.2.0"', 'D.VERSION = "0.3.0"', 1))

          tests = Path('client-addons-src/GroupComposer/tests/test_server_contract.py')
          test_text = tests.read_text()
          anchor = '''assert not missing_raids, f"Raid activity missing from backend validator: {missing_raids}"
          '''
          addition = '''assert not missing_raids, f"Raid activity missing from backend validator: {missing_raids}"
          assert 'UsesWrathRaidDifficulty(plan.config.activity)' in SERVER, (
              "Live raid difficulty application no longer distinguishes Wrath from legacy Classic/TBC raids"
          )
          assert 'group->SetRaidDifficulty(RAID_DIFFICULTY_10MAN_NORMAL);' in SERVER, (
              "Legacy Classic/TBC raids must reset the live group to regular raid difficulty"
          )
          '''
          if anchor not in test_text:
              raise SystemExit('Raid contract assertion anchor not found')
          tests.write_text(test_text.replace(anchor, addition, 1))
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Group Composer CI'
          git config user.email 'actions@users.noreply.github.com'
          git add modules/mod-raid-roster/src/GroupComposerCommand.cpp client-addons-src/GroupComposer/Data.lua client-addons-src/GroupComposer/tests/test_server_contract.py
          git diff --cached --check
          git commit -m 'fix: reset legacy raid instance difficulty'
          git push origin HEAD:feature/group-composer-audit
