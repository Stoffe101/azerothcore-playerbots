name: One-shot Group Composer final UI hardening

on:
  push:
    branches:
      - feature/group-composer-audit
    paths:
      - .github/workflows/group-composer-final-ui-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/group-composer-audit
          fetch-depth: 0

      - name: Apply final UI hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ui_path = Path('client-addons-src/GroupComposer/UI.lua')
          ui = ui_path.read_text()

          old_options = '''local optionDefs = {
              { key = "preferGuild", label = "Prefer Guild Members", x = 14, y = -72 },
              { key = "fillWorld", label = "Fill Missing Roles With World Bots", x = 14, y = -108 },
              { key = "keepMe", label = "Keep Me In Roster", x = 300, y = -72 },
              { key = "balanceClasses", label = "Balance Class / Utility Coverage", x = 300, y = -108 },
              { key = "avoidDuplicateClasses", label = "Avoid Duplicate Classes When Practical", x = 570, y = -72 },
          }
          for _, def in ipairs(optionDefs) do
              local key = def.key
              local cb = Checkbox(optionsCard, def.label, true, function(checked)
                  GC:GetConfig().options[key] = checked
                  GC:ResetPlan("Roster rule changed"); GC:Fire("CONFIG_CHANGED", GC:GetConfig())
              end)
              cb:SetPoint("TOPLEFT", def.x, def.y)
              UI.optionWidgets[key] = cb
          end
          local ilvlLabel = Text(optionsCard, "Minimum Item Level", "GameFontHighlightSmall", C.text)
          '''
          new_options = '''local optionDefs = {
              { key = "preferGuild", label = "Prefer Guild Members", x = 14, y = -72 },
              { key = "fillWorld", label = "Fill Missing Roles With World Bots", x = 14, y = -108 },
              { key = "balanceClasses", label = "Balance Class / Utility Coverage", x = 300, y = -108 },
              { key = "avoidDuplicateClasses", label = "Avoid Duplicate Classes When Practical", x = 570, y = -72 },
          }
          for _, def in ipairs(optionDefs) do
              local key = def.key
              local cb = Checkbox(optionsCard, def.label, true, function(checked)
                  GC:GetConfig().options[key] = checked
                  GC:ResetPlan("Roster rule changed"); GC:Fire("CONFIG_CHANGED", GC:GetConfig())
              end)
              cb:SetPoint("TOPLEFT", def.x, def.y)
              UI.optionWidgets[key] = cb
          end
          local anchorText = Text(optionsCard, "YOU - Locked human anchor", "GameFontNormalSmall", C.gold)
          anchorText:SetPoint("TOPLEFT", 304, -76)
          local anchorHint = Text(optionsCard, "Always included in every composed roster", "GameFontHighlightSmall", C.muted)
          anchorHint:SetPoint("TOPLEFT", 304, -91)
          local ilvlLabel = Text(optionsCard, "Minimum Item Level", "GameFontHighlightSmall", C.text)
          '''
          if old_options not in ui:
              raise SystemExit('UI roster-options marker not found')
          ui = ui.replace(old_options, new_options, 1)

          pref_start = ui.index('UI.prefRows = { TANK = {}, HEALER = {}, DPS = {} }')
          pref_end_marker = 'UI.BuildPrefRows = BuildPrefRows'
          pref_end = ui.index(pref_end_marker, pref_start) + len(pref_end_marker)
          new_prefs = r'''UI.prefRows = { TANK = {}, HEALER = {}, DPS = {} }
          UI.prefEmpty = {}
          UI.prefAreas = {}
          local function ClassItemsForRole(role)
              local items = { { value = "ANY", label = "Any valid class" } }
              for _, token in ipairs(D.CLASS_ORDER) do if D.CLASS_ROLE[role][token] then items[#items + 1] = { value = token, label = D.CLASS_LABEL[token] } end end
              return items
          end
          local function SpecItems(role, classToken)
              local items = { { value = "ANY", label = "Any valid spec" } }
              if classToken and classToken ~= "ANY" then
                  for _, spec in ipairs(D.SPECS[classToken] or {}) do
                      if spec.role == role or (role == "TANK" and spec.canTank) then items[#items + 1] = { value = spec.id, label = spec.label } end
                  end
              end
              return items
          end
          local function RemovePreference(role, index)
              if not role or not index then return end
              table.remove(GC:GetConfig().preferences[role], index)
              GC:ResetPlan("Preference changed"); GC:Fire("CONFIG_CHANGED", GC:GetConfig())
          end
          local function AddPreference(role)
              local list = GC:GetConfig().preferences[role]
              if #list >= 4 then GC:Fire("STATUS", "Up to four visible preferences per role are supported in this panel."); return end
              list[#list + 1] = { class = "ANY", spec = "ANY", required = false }
              GC:ResetPlan("Preference changed"); GC:Fire("CONFIG_CHANGED", GC:GetConfig())
          end
          for i, roleValue in ipairs({ "TANK", "HEALER", "DPS" }) do
              local role = roleValue
              local area = CreateFrame("Frame", nil, prefsContainer)
              area:SetWidth(246); area:SetPoint("TOPLEFT", (i - 1) * 258, 0); area:SetPoint("BOTTOM", 0, 0)
              local roleTitle = Text(area, RoleName(role), "GameFontNormal", ROLE_COLOR[role]); roleTitle:SetPoint("TOPLEFT", 4, 0)
              local add = Button(area, "+ Preference", 94, 22, function() AddPreference(role) end); add:SetPoint("TOPRIGHT", -2, 6)
              UI.prefAreas[role] = area
              local empty = Text(area, "Any valid " .. string.lower(RoleName(role)), "GameFontHighlightSmall", C.dim)
              empty:SetPoint("TOPLEFT", 4, -28); empty:Hide()
              UI.prefEmpty[role] = empty
          end

          local function AcquirePrefRow(role, index)
              local existing = UI.prefRows[role][index]
              if existing then return existing end
              local area = UI.prefAreas[role]
              local row = CreateFrame("Frame", nil, area)
              row:SetHeight(36)

              local classDD
              classDD = Dropdown(row, 86,
                  function() return ClassItemsForRole(row.currentRole or role) end,
                  function()
                      local pref = row.currentPref
                      return pref and (pref.class or "ANY") or "ANY"
                  end,
                  function(value)
                      local pref = row.currentPref
                      if not pref then return end
                      pref.class = value; pref.spec = "ANY"
                      GC:ResetPlan("Preference changed"); GC:Fire("CONFIG_CHANGED", GC:GetConfig())
                  end)
              classDD:SetPoint("LEFT", -14, 0)

              local specDD
              specDD = Dropdown(row, 78,
                  function()
                      local pref = row.currentPref
                      return SpecItems(row.currentRole or role, pref and pref.class or "ANY")
                  end,
                  function()
                      local pref = row.currentPref
                      if not pref then return "ANY" end
                      return pref.spec == nil and "ANY" or pref.spec
                  end,
                  function(value)
                      local pref = row.currentPref
                      if not pref then return end
                      pref.spec = value
                      GC:ResetPlan("Preference changed"); GC:Fire("CONFIG_CHANGED", GC:GetConfig())
                  end)
              specDD:SetPoint("LEFT", classDD, "RIGHT", -22, 0)

              local req = CreateFrame("CheckButton", nil, row, "UICheckButtonTemplate")
              req:SetWidth(20); req:SetHeight(20); req:SetPoint("RIGHT", -26, 0)
              req:SetScript("OnClick", function(self)
                  local pref = row.currentPref
                  if not pref then return end
                  pref.required = self:GetChecked() and true or false
                  GC:ResetPlan("Preference changed"); GC:Fire("CONFIG_CHANGED", GC:GetConfig())
              end)
              local reqText = Text(row, "Req", "GameFontHighlightSmall", C.muted); reqText:SetPoint("LEFT", req, "RIGHT", -2, 0)
              local remove = CreateFrame("Button", nil, row, "UIPanelCloseButton")
              remove:SetWidth(20); remove:SetHeight(20); remove:SetPoint("RIGHT", 2, 0)
              remove:SetScript("OnClick", function() RemovePreference(row.currentRole, row.currentIndex) end)

              row.classDD, row.specDD, row.required = classDD, specDD, req
              UI.prefRows[role][index] = row
              return row
          end

          local function BuildPrefRows()
              local c = GC:GetConfig()
              for _, role in ipairs({ "TANK", "HEALER", "DPS" }) do
                  UI.prefEmpty[role]:Hide()
                  for _, row in ipairs(UI.prefRows[role]) do row:Hide() end
                  local list = c.preferences[role] or {}
                  if #list == 0 then
                      UI.prefEmpty[role]:Show()
                  else
                      for index, pref in ipairs(list) do
                          local row = AcquirePrefRow(role, index)
                          row.currentRole, row.currentIndex, row.currentPref = role, index, pref
                          row:ClearAllPoints(); row:SetPoint("TOPLEFT", 0, -20 - (index - 1) * 38); row:SetPoint("RIGHT", 0, 0)
                          row.required:SetChecked(pref.required and true or false)
                          row.classDD:Refresh(); row.specDD:Refresh(); row:Show()
                      end
                  end
              end
          end
          UI.BuildPrefRows = BuildPrefRows'''
          ui = ui[:pref_start] + new_prefs + ui[pref_end:]

          roster_start = ui.index('local function DestroyRosterRows()')
          roster_end = ui.index('\n\nfunction UI:RefreshConfig()', roster_start)
          new_roster = r'''local function HideRosterRows()
              for _, row in ipairs(UI.rosterRows or {}) do row:Hide() end
              for _, row in ipairs(UI.rosterGroupRows or {}) do row:Hide() end
              if UI.rosterEmpty then UI.rosterEmpty:Hide() end
          end

          UI.rosterGroupRows = UI.rosterGroupRows or {}

          local function AcquireRosterGroup(index)
              local holder = UI.rosterGroupRows[index]
              if holder then return holder end
              holder = CreateFrame("Frame", nil, rosterContent)
              holder:SetWidth(272); holder:SetHeight(20)
              holder.text = Text(holder, "", "GameFontNormalSmall", C.muted)
              holder.text:SetPoint("LEFT", 2, 0)
              UI.rosterGroupRows[index] = holder
              return holder
          end

          local function AcquireRosterRow(index)
              local row = UI.rosterRows[index]
              if row then return row end
              row = CreateFrame("Frame", nil, rosterContent)
              row:SetWidth(272); row:SetHeight(28)
              row.bg = Solid(row, "BACKGROUND", C.panel, 0.85); row.bg:SetAllPoints(row)
              row.stripe = Solid(row, "ARTWORK", C.muted); row.stripe:SetPoint("TOPLEFT"); row.stripe:SetPoint("BOTTOMLEFT"); row.stripe:SetWidth(3)
              row.nameText = Text(row, "", "GameFontHighlightSmall", C.text); row.nameText:SetPoint("LEFT", 8, 0); row.nameText:SetWidth(108); row.nameText:SetJustifyH("LEFT")
              row.roleText = Text(row, "", "GameFontHighlightSmall", C.muted); row.roleText:SetPoint("LEFT", 120, 0); row.roleText:SetWidth(52); row.roleText:SetJustifyH("LEFT")
              row.classText = Text(row, "", "GameFontHighlightSmall", C.muted); row.classText:SetPoint("LEFT", 176, 0); row.classText:SetWidth(72); row.classText:SetJustifyH("LEFT")
              row.sourceText = Text(row, "", "GameFontNormalSmall", C.blue); row.sourceText:SetPoint("RIGHT", -6, 0)
              UI.rosterRows[index] = row
              return row
          end

          local function RenderRoster(plan)
              HideRosterRows()
              local members, rowHeight, lastGroup, y = plan.members or {}, 28, -1, 0
              local groupIndex = 0
              for index, member in ipairs(members) do
                  if member.subgroup and member.subgroup > 0 and member.subgroup ~= lastGroup then
                      lastGroup = member.subgroup
                      groupIndex = groupIndex + 1
                      local group = AcquireRosterGroup(groupIndex)
                      group:ClearAllPoints(); group:SetPoint("TOPLEFT", 0, -y)
                      group.text:SetText("Group " .. member.subgroup); group:Show(); y = y + 20
                  end

                  local row = AcquireRosterRow(index)
                  row:ClearAllPoints(); row:SetPoint("TOPLEFT", 0, -y)
                  local bg = index % 2 == 0 and C.panel2 or C.panel
                  row.bg:SetTexture(bg[1], bg[2], bg[3], 0.85)
                  local color = ROLE_COLOR[member.role] or C.muted
                  row.stripe:SetTexture(color[1], color[2], color[3], color[4] or 1)
                  row.nameText:SetText(member.name or "?")
                  local nameColor = member.human and C.gold or C.text
                  row.nameText:SetTextColor(nameColor[1], nameColor[2], nameColor[3], nameColor[4] or 1)
                  row.roleText:SetText(RoleName(member.role)); row.roleText:SetTextColor(color[1], color[2], color[3], color[4] or 1)
                  row.classText:SetText(D.CLASS_LABEL[member.class] or member.class or "?")
                  local sourceLetter = member.human and "H" or (member.source == "GUILD" and "G" or (member.source == "ROSTER" and "R" or "W"))
                  row.sourceText:SetText(sourceLetter)
                  local sourceColor = member.human and C.gold or (member.source == "GUILD" and C.green or C.blue)
                  row.sourceText:SetTextColor(sourceColor[1], sourceColor[2], sourceColor[3], sourceColor[4] or 1)
                  row:Show(); y = y + rowHeight + 2
              end

              if #members == 0 then
                  if not UI.rosterEmpty then
                      UI.rosterEmpty = Text(rosterContent, "No roster preview yet.\n\nFind Roster builds the team without inviting anyone.", "GameFontHighlightSmall", C.dim)
                      UI.rosterEmpty:SetPoint("TOPLEFT", 4, -8); UI.rosterEmpty:SetPoint("RIGHT", -8, 0); UI.rosterEmpty:SetJustifyH("LEFT")
                  end
                  UI.rosterEmpty:Show(); y = 100
              end
              rosterContent:SetHeight(math.max(340, y + 12))
          end'''
          ui = ui[:roster_start] + new_roster + ui[roster_end:]
          ui_path.write_text(ui)

          advanced_path = Path('client-addons-src/GroupComposer/Advanced.lua')
          advanced = advanced_path.read_text()
          layout_start = advanced.index('A.layoutArea, A.layoutRows, A.groupCards = layoutArea, {}, {}')
          layout_end = advanced.index('\n\n-- DIAGNOSTICS', layout_start)
          new_layout = r'''A.layoutArea, A.layoutRows, A.groupCards = layoutArea, {}, {}
          A.layoutEmpty = nil

          local function FindDropGroup(frameUnderMouse)
              local node = frameUnderMouse
              for _ = 1, 8 do
                  if not node then return nil end
                  if node.groupIndex then return node.groupIndex end
                  node = node:GetParent()
              end
          end

          local function IsStableMember(config, member)
              if member.human then return true end
              local key = string.lower(member.name or "")
              for _, pin in ipairs(config.pinned or {}) do
                  if string.lower(pin.name) == key then return true end
              end
              return false
          end

          local function HideLayoutPool()
              for _, row in ipairs(A.layoutRows) do row:Hide() end
              for _, card in ipairs(A.groupCards) do card:Hide() end
              if A.layoutEmpty then A.layoutEmpty:Hide() end
          end

          local function AcquireGroupCard(index)
              local card = A.groupCards[index]
              if card then return card end
              card = CreateFrame("Frame", nil, layoutArea)
              card:EnableMouse(true)
              card.bg = Solid(card, "BACKGROUND", C.panel); card.bg:SetAllPoints(card)
              card.header = Solid(card, "ARTWORK", C.panel2); card.header:SetPoint("TOPLEFT"); card.header:SetPoint("TOPRIGHT"); card.header:SetHeight(32)
              card.groupText = Text(card, "", "GameFontNormal", C.text); card.groupText:SetPoint("TOPLEFT", 10, -9)
              card.countText = Text(card, "", "GameFontHighlightSmall", C.gold); card.countText:SetPoint("TOPRIGHT", -10, -10)
              A.groupCards[index] = card
              return card
          end

          local function AcquireLayoutRow(index)
              local row = A.layoutRows[index]
              if row then return row end
              row = CreateFrame("Button", nil, layoutArea)
              row:RegisterForDrag("LeftButton")
              row.bg = Solid(row, "BACKGROUND", C.bg, 0.86); row.bg:SetAllPoints(row)
              row.stripe = Solid(row, "ARTWORK", C.muted); row.stripe:SetPoint("TOPLEFT"); row.stripe:SetPoint("BOTTOMLEFT"); row.stripe:SetWidth(3)
              row.nameText = Text(row, "", "GameFontHighlightSmall", C.text); row.nameText:SetJustifyH("LEFT")
              row.detailText = Text(row, "", "GameFontHighlightSmall", C.muted); row.detailText:SetJustifyH("LEFT")
              row.leftButton = Button(row, "<", 26, 22, function()
                  local member = row.currentMember
                  if not member then return end
                  local target = (row.currentGroup or 1) - 1
                  if target < 1 then target = row.groupCount or 1 end
                  GC:MoveMember(member.name, target)
              end)
              row.rightButton = Button(row, ">", 26, 22, function()
                  local member = row.currentMember
                  if not member then return end
                  local target = (row.currentGroup or 1) + 1
                  if target > (row.groupCount or 1) then target = 1 end
                  GC:MoveMember(member.name, target)
              end)
              row.leftButton:SetPoint("RIGHT", -34, 0); row.rightButton:SetPoint("RIGHT", -5, 0)
              row:SetScript("OnDragStart", function(self)
                  GC.dragMember = self.currentMember and self.currentMember.name or nil
              end)
              row:SetScript("OnDragStop", function()
                  local dragged = GC.dragMember
                  GC.dragMember = nil
                  local target = GetMouseFocus and FindDropGroup(GetMouseFocus()) or nil
                  if dragged and target then GC:MoveMember(dragged, target) end
              end)
              row:SetScript("OnEnter", function(self)
                  local member = self.currentMember
                  if not member then return end
                  GameTooltip:SetOwner(self, "ANCHOR_RIGHT")
                  GameTooltip:AddLine(member.name or "?", 1, 1, 1)
                  GameTooltip:AddLine((D.ROLE_LABEL[member.role] or member.role or "?") .. " • " .. (D.CLASS_LABEL[member.class] or member.class or "?") .. " • " .. (member.spec or ""), 0.8, 0.85, 0.95)
                  GameTooltip:AddLine(member.human and "Human / locked" or ((member.source or "WORLD") .. (member.pinned and " / pinned" or "")), member.human and 1 or 0.7, member.human and 0.7 or 0.9, 0.3)
                  if IsStableMember(GC:GetConfig(), member) then GameTooltip:AddLine("This member's subgroup is saved with custom profiles.", 0.55, 0.85, 1, true) end
                  GameTooltip:Show()
              end)
              row:SetScript("OnLeave", function() GameTooltip:Hide() end)
              A.layoutRows[index] = row
              return row
          end

          function A:RefreshLayout()
              HideLayoutPool()
              local plan, config = GC.plan, GC:GetConfig()
              if not plan.ready or #(plan.members or {}) == 0 then
                  if not A.layoutEmpty then
                      A.layoutEmpty = Text(layoutArea, "Find a roster first. The complete subgroup layout will appear here before anyone is invited.", "GameFontHighlight", C.dim)
                      A.layoutEmpty:SetPoint("TOPLEFT", 14, -10); A.layoutEmpty:SetWidth(950); A.layoutEmpty:SetJustifyH("LEFT")
                  end
                  A.layoutEmpty:Show()
                  return
              end

              local groupCount = config.size <= 5 and 1 or math.min(8, math.ceil(config.size / 5))
              local columns = groupCount <= 5 and groupCount or 4
              local rowCount = math.ceil(groupCount / columns)
              local gap = 8
              local areaWidth = 1000
              local cardWidth = math.floor((areaWidth - (columns - 1) * gap) / columns)
              local cardHeight = rowCount == 1 and 470 or 232
              local membersByGroup = {}
              for group = 1, groupCount do membersByGroup[group] = {} end
              for _, member in ipairs(plan.members) do
                  local group = math.max(1, math.min(groupCount, tonumber(member.subgroup) or 1))
                  membersByGroup[group][#membersByGroup[group] + 1] = member
              end

              local poolIndex = 0
              for group = 1, groupCount do
                  local rowIndex = math.floor((group - 1) / columns)
                  local columnIndex = (group - 1) % columns
                  local card = AcquireGroupCard(group)
                  card:ClearAllPoints(); card:SetWidth(cardWidth); card:SetHeight(cardHeight)
                  card:SetPoint("TOPLEFT", columnIndex * (cardWidth + gap), -(rowIndex * (cardHeight + gap)))
                  card.groupIndex = group; card.groupText:SetText("GROUP " .. group)
                  card.countText:SetText(tostring(#membersByGroup[group]) .. "/5")
                  local countColor = #membersByGroup[group] == 5 and C.green or C.gold
                  card.countText:SetTextColor(countColor[1], countColor[2], countColor[3], countColor[4] or 1)
                  card:Show()

                  for memberIndex, member in ipairs(membersByGroup[group]) do
                      poolIndex = poolIndex + 1
                      local compact = rowCount > 1
                      local rowHeight = compact and 34 or 58
                      local rowStep = compact and 37 or 62
                      local row = AcquireLayoutRow(poolIndex)
                      row:SetParent(card); row:ClearAllPoints(); row:SetHeight(rowHeight)
                      row:SetPoint("TOPLEFT", 6, -36 - (memberIndex - 1) * rowStep); row:SetPoint("RIGHT", -6, 0)
                      row.groupIndex, row.currentGroup, row.groupCount, row.currentMember = group, group, groupCount, member
                      local bg = memberIndex % 2 == 0 and C.panel2 or C.bg
                      row.bg:SetTexture(bg[1], bg[2], bg[3], 0.86)
                      local roleColor = ROLE_COLOR[member.role] or C.muted
                      row.stripe:SetTexture(roleColor[1], roleColor[2], roleColor[3], roleColor[4] or 1)
                      row.nameText:ClearAllPoints(); row.nameText:SetPoint("TOPLEFT", 8, compact and -5 or -10); row.nameText:SetWidth(cardWidth - 82)
                      row.nameText:SetText(member.name or "?")
                      local nameColor = member.human and C.gold or C.text
                      row.nameText:SetTextColor(nameColor[1], nameColor[2], nameColor[3], nameColor[4] or 1)
                      if compact then
                          row.detailText:Hide()
                      else
                          row.detailText:ClearAllPoints(); row.detailText:SetPoint("BOTTOMLEFT", 8, 9); row.detailText:SetWidth(cardWidth - 82)
                          row.detailText:SetText((D.ROLE_LABEL[member.role] or member.role or "?") .. " • " .. (D.CLASS_LABEL[member.class] or member.class or "?")); row.detailText:Show()
                      end
                      row:Show()
                  end
              end
          end'''
          advanced = advanced[:layout_start] + new_layout + advanced[layout_end:]
          advanced_path.write_text(advanced)

          test_path = Path('client-addons-src/GroupComposer/tests/test_server_contract.py')
          tests = test_path.read_text()
          old_reads = '''POLISH = (ROOT / "client-addons-src/GroupComposer/Polish.lua").read_text(encoding="utf-8")
          SERVER = (ROOT / "modules/mod-raid-roster/src/GroupComposerCommand.cpp").read_text(encoding="utf-8")
          '''
          new_reads = '''POLISH = (ROOT / "client-addons-src/GroupComposer/Polish.lua").read_text(encoding="utf-8")
          UI = (ROOT / "client-addons-src/GroupComposer/UI.lua").read_text(encoding="utf-8")
          ADVANCED = (ROOT / "client-addons-src/GroupComposer/Advanced.lua").read_text(encoding="utf-8")
          SERVER = (ROOT / "modules/mod-raid-roster/src/GroupComposerCommand.cpp").read_text(encoding="utf-8")
          '''
          if old_reads not in tests:
              raise SystemExit('contract source-read marker not found')
          tests = tests.replace(old_reads, new_reads, 1)
          client_marker = '''assert 'StaticPopup_Show("GROUPCOMPOSER_CONFIRM_ASSEMBLY"' in POLISH, (
              "Assemble no longer routes through the confirmation popup"
          )
          '''
          client_addition = '''assert 'StaticPopup_Show("GROUPCOMPOSER_CONFIRM_ASSEMBLY"' in POLISH, (
              "Assemble no longer routes through the confirmation popup"
          )
          assert 'key = "keepMe"' not in UI, (
              "The immutable local-player anchor must not be exposed as a misleading toggle"
          )
          assert 'YOU - Locked human anchor' in UI, (
              "The main composer should explain that the local player is always included"
          )
          assert 'local function AcquirePrefRow' in UI and 'local function AcquireRosterRow' in UI, (
              "Main-window preference/preview rows must be pooled instead of leaking WoW frames on refresh"
          )
          assert 'local function AcquireLayoutRow' in ADVANCED and 'local function AcquireGroupCard' in ADVANCED, (
              "Roster Editor layout rows/cards must be pooled for repeated 25/40-player refreshes"
          )
          '''
          if client_marker not in tests:
              raise SystemExit('contract client-safety marker not found')
          tests = tests.replace(client_marker, client_addition, 1)
          test_path.write_text(tests)

          acceptance_path = Path('docs/group-composer-acceptance.md')
          acceptance = acceptance_path.read_text()
          old_long = '''Expected: role dropdowns and rows remain responsive, no progressive frame explosion or major FPS degradation occurs, and scrolling/section layout stays intact for large 25/40-player rosters.
          '''
          new_long = '''Expected: human-role dropdowns, class/spec preference rows, main roster preview rows and Roster Editor subgroup cards are pooled/reused. Repeated refreshes must remain responsive without progressive frame growth or major FPS degradation, and scrolling/section layout must stay intact for large 25/40-player rosters. Verify that the main Roster Rules panel shows the composing character as a locked human anchor and does not offer a fake "Keep Me" toggle.
          '''
          if old_long not in acceptance:
              raise SystemExit('acceptance long-session marker not found')
          acceptance_path.write_text(acceptance.replace(old_long, new_long, 1))

          data_path = Path('client-addons-src/GroupComposer/Data.lua')
          data = data_path.read_text()
          if 'D.VERSION = "0.3.0"' in data:
              data_path.write_text(data.replace('D.VERSION = "0.3.0"', 'D.VERSION = "0.3.1"', 1))
          elif 'D.VERSION = "0.3.1"' not in data:
              raise SystemExit('unexpected Group Composer data version')

          toc_path = Path('client-addons-src/GroupComposer/GroupComposer.toc')
          toc = toc_path.read_text()
          if '## Version: 0.3.0' in toc:
              toc_path.write_text(toc.replace('## Version: 0.3.0', '## Version: 0.3.1', 1))
          elif '## Version: 0.3.1' not in toc:
              raise SystemExit('unexpected Group Composer TOC version')
          PY

          git diff --check

      - name: Commit hardened UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Group Composer CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/group-composer-final-ui-hardening.yml
          git add client-addons-src/GroupComposer/UI.lua \
                  client-addons-src/GroupComposer/Advanced.lua \
                  client-addons-src/GroupComposer/Data.lua \
                  client-addons-src/GroupComposer/GroupComposer.toc \
                  client-addons-src/GroupComposer/tests/test_server_contract.py \
                  docs/group-composer-acceptance.md
          git diff --cached --check
          git commit -m 'fix: pool Group Composer dynamic UI rows'
          git push origin HEAD:feature/group-composer-audit
