name: Apply Group Composer reserve transformation

on:
  push:
    branches:
      - test/runtime-hardening-group-composer
    paths:
      - tools/apply_group_composer_reserve.py
      - .github/workflows/apply-group-composer-reserve.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/runtime-hardening-group-composer
          fetch-depth: 0

      - name: Apply deterministic reserve transformation
        run: python3 tools/apply_group_composer_reserve.py

      - name: Keep generated commit source-only
        run: |
          git checkout -- .github/workflows/group-composer.yml

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "feat(group-composer): add shared 80-slot bot reserve"
          git push origin HEAD:test/runtime-hardening-group-composer
