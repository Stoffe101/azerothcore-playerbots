name: Finalize branch fixups

on:
  push:
    branches:
      - feature/living-world-titan-runes-finalize

permissions:
  contents: write

jobs:
  fixups:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/living-world-titan-runes-finalize

      - name: Wire local modules and remove nested-lock bug
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('setup.sh')
          s = p.read_text()
          old = 'LOCAL_MODULES=( "mod-playerbot-chatter" "mod-raid-roster" "mod-ahbot-price" "mod-wintergrasp-bots" "mod-arena-roster" )'
          new = 'LOCAL_MODULES=( "mod-playerbot-chatter" "mod-raid-roster" "mod-ahbot-price" "mod-wintergrasp-bots" "mod-arena-roster" "mod-living-world" "mod-titan-rune" )'
          if old not in s and new not in s:
              raise SystemExit('setup.sh LOCAL_MODULES anchor not found')
          p.write_text(s.replace(old, new))

          p = Path('update.sh')
          s = p.read_text()
          old = 'for lm in mod-playerbot-chatter mod-raid-roster mod-ahbot-price mod-wintergrasp-bots mod-arena-roster; do'
          new = 'for lm in mod-playerbot-chatter mod-raid-roster mod-ahbot-price mod-wintergrasp-bots mod-arena-roster mod-living-world mod-titan-rune; do'
          if old not in s and new not in s:
              raise SystemExit('update.sh local-module loop anchor not found')
          p.write_text(s.replace(old, new))

          p = Path('modules/mod-titan-rune/src/TitanRune.cpp')
          s = p.read_text()
          old = 'if (GetProtocol(player) != Protocol::Alpha && GetFamily(player->GetMapId()) == Family::Titan && ps.purifiedStacks)'
          new = 'if (protocol != Protocol::Alpha && GetFamily(player->GetMapId()) == Family::Titan && ps.purifiedStacks)'
          if old not in s and new not in s:
              raise SystemExit('TitanRune protocol anchor not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Commit fixups and remove one-shot workflow
        run: |
          rm -f .github/workflows/finalize-fixups.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add setup.sh update.sh modules/mod-titan-rune/src/TitanRune.cpp .github/workflows/finalize-fixups.yml
          git commit -m 'Wire Living World and Titan Rune into server bootstrap'
          git push origin HEAD:feature/living-world-titan-runes-finalize
