name: Integration validation

on:
  push:
    branches:
      - feature/full-adventure-stack-guildsync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Pinned patch stack and WotLK build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v4

      - name: Clone pinned AzerothCore tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          git clone --no-checkout https://github.com/mod-playerbots/azerothcore-wotlk.git audit/ac
          git -C audit/ac fetch --depth 1 origin 413bea61a85e20d9caef7d66fc601a661fdddd9d
          git -C audit/ac checkout --detach 413bea61a85e20d9caef7d66fc601a661fdddd9d

      - name: Clone pinned patch dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/ac/modules

          git clone --no-checkout https://github.com/mod-playerbots/mod-playerbots.git audit/ac/modules/mod-playerbots
          git -C audit/ac/modules/mod-playerbots fetch --depth 1 origin b949b50bfcdd4fab937781bac2d7765e39330e4b
          git -C audit/ac/modules/mod-playerbots checkout --detach b949b50bfcdd4fab937781bac2d7765e39330e4b

          git clone --no-checkout https://github.com/ZhengPeiRu21/mod-individual-progression.git audit/ac/modules/mod-individual-progression
          git -C audit/ac/modules/mod-individual-progression fetch --depth 1 origin 977e2005bacf97f35e506eb27b8af6b2ea1136af
          git -C audit/ac/modules/mod-individual-progression checkout --detach 977e2005bacf97f35e506eb27b8af6b2ea1136af

          git clone --no-checkout https://github.com/Wishmaster117/mod-multibot-bridge.git audit/ac/modules/mod-multibot-bridge
          git -C audit/ac/modules/mod-multibot-bridge fetch --depth 1 origin 759c100d5e508b9af28531a2642ded70619828ba
          git -C audit/ac/modules/mod-multibot-bridge checkout --detach 759c100d5e508b9af28531a2642ded70619828ba

          git clone --no-checkout https://github.com/lathcf/azerothcore-mod-era-talents.git audit/ac/modules/mod-era-talents
          git -C audit/ac/modules/mod-era-talents fetch --depth 1 origin 3a0d9776c6837d8a5e5038c23c01c4fc388d90f8
          git -C audit/ac/modules/mod-era-talents checkout --detach 3a0d9776c6837d8a5e5038c23c01c4fc388d90f8

      - name: Patch 0001 lfg unrestricted loot
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0001-lfg-unrestricted-loot.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0001-lfg-unrestricted-loot.patch"
      - name: Patch 0003 playerbot wintergrasp
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0003-playerbot-wintergrasp.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0003-playerbot-wintergrasp.patch"
      - name: Patch 0004 playerbot wintergrasp siege
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0004-playerbot-wintergrasp-siege.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0004-playerbot-wintergrasp-siege.patch"
      - name: Patch 0005 playerbot arena coordination
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0005-playerbot-arena-coordination.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0005-playerbot-arena-coordination.patch"
      - name: Patch 0006 playerbot kologarn eyebeam
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0006-playerbot-kologarn-eyebeam.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0006-playerbot-kologarn-eyebeam.patch"
      - name: Patch 0007 playerbot lich king phase 3
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0007-playerbot-lichking-phase3.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0007-playerbot-lichking-phase3.patch"
      - name: Patch 0008 core item update queue dedup
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0008-core-item-update-queue-dedup.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0008-core-item-update-queue-dedup.patch"
      - name: Patch 0010 core dynamic visibility
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0010-core-dynamic-visibility-extend.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0010-core-dynamic-visibility-extend.patch"
      - name: Patch 0011 playerbot perfmon hotpath
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0011-playerbot-perfmon-hotpath.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0011-playerbot-perfmon-hotpath.patch"
      - name: Patch 0012 core bot aura batching
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0012-core-bot-aura-batching.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0012-core-bot-aura-batching.patch"
      - name: Patch 0013 core gameevent sweep skip
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0013-core-gameevent-sai-sweep-skip.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0013-core-gameevent-sai-sweep-skip.patch"
      - name: Patch 0014 individual progression force limit
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0014-ip-force-progression-limit.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0014-ip-force-progression-limit.patch"
      - name: Patch 0014 playerbot sunwell
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0014-playerbot-sunwell.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0014-playerbot-sunwell.patch"
      - name: Patch 0016 playerbot aq40 twins
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0016-playerbot-aq40-twins.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0016-playerbot-aq40-twins.patch"
      - name: Patch 0017 playerbot owner trade bypass
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0017-playerbot-owner-trade-bypass.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0017-playerbot-owner-trade-bypass.patch"
      - name: Patch 0020 playerbot smart loot defaults
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0020-playerbot-smart-loot-defaults.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0020-playerbot-smart-loot-defaults.patch"
      - name: Patch 0021 playerbot human upgrade protection
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0021-playerbot-human-upgrade-protection.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0021-playerbot-human-upgrade-protection.patch"
      - name: Patch 0022 playerbot population recovery
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0022-playerbot-population-recovery-api.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0022-playerbot-population-recovery-api.patch"
      - name: Patch 0023 playerbot real guild cache fallback
        run: git -C audit/ac apply --check "$GITHUB_WORKSPACE/patches/0023-playerbot-real-guild-cache-fallback.patch" && git -C audit/ac apply "$GITHUB_WORKSPACE/patches/0023-playerbot-real-guild-cache-fallback.patch"

      - name: Validate EraTalents integration patches
        shell: bash
        run: |
          set -euo pipefail
          test -x audit/ac/modules/mod-era-talents/apply-patches.sh
          audit/ac/modules/mod-era-talents/apply-patches.sh "$GITHUB_WORKSPACE/audit/ac"

      - name: Verify expected integration files exist
        shell: bash
        run: |
          set -euo pipefail
          test -f audit/ac/modules/mod-playerbots/src/Ai/Base/Actions/LootRollAction.cpp
          grep -q 'GroupHumanMainSpecUpgrade' audit/ac/modules/mod-playerbots/src/Ai/Base/Actions/LootRollAction.cpp
          test -f modules/mod-raid-roster/src/GuildGroupDirector.cpp
          test -f modules/mod-raid-roster/src/EncounterLifecycle.cpp
          test -f modules/mod-raid-roster/src/RaidLeaderKnowledge.cpp
          test -f modules/mod-playerbot-chatter/src/PBAIGuildServices.cpp
          echo 'Static integration audit completed successfully.'

      - name: Stage local server modules into pinned core
        shell: bash
        run: |
          set -euo pipefail
          for module in modules/*; do
            name="$(basename "$module")"
            rm -rf "audit/ac/modules/$name"
            cp -a "$module" "audit/ac/modules/$name"
          done
          test -f audit/ac/modules/mod-raid-roster/src/EncounterLifecycle.cpp
          test -f audit/ac/modules/mod-playerbot-chatter/src/PBAIGuildServices.cpp

      - name: Install AzerothCore build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake make gcc g++ clang \
            libmysqlclient-dev libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev

      - name: Configure pinned WotLK server
        shell: bash
        run: |
          set -euo pipefail
          cmake -S audit/ac -B audit/ac/build \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build pinned WotLK server and complete integration stack
        shell: bash
        run: |
          set -euo pipefail
          cmake --build audit/ac/build --config Release -- -j2
          echo 'Pinned WotLK integration compiled successfully.'
