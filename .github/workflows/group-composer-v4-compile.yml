name: Group Composer V4 compile

on:
  push:
    branches:
      - test/group-composer-v4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: group-composer-v4-compile
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove -y needrestart || true
          sudo apt-get install -y ccache clang-18 cmake make build-essential cmake-data \
            libboost-all-dev libbz2-dev libmysql++-dev libreadline-dev libssl-dev libtool \
            openssl zlib1g-dev google-perftools libmysqlclient-dev libncurses-dev
      - name: Assemble exact pinned tree
        shell: bash
        run: |
          set -euo pipefail
          CORE="$GITHUB_WORKSPACE/azerothcore-wotlk"
          git clone https://github.com/mod-playerbots/azerothcore-wotlk.git "$CORE"
          git -C "$CORE" checkout 06234df3d5ab26c93f4f1f06f3edb828b73ecd3c
          clone_module() {
            local name="$1" url="$2" pin="$3"
            git clone "$url" "$CORE/modules/$name"
            git -C "$CORE/modules/$name" checkout "$pin"
          }
          clone_module mod-playerbots https://github.com/mod-playerbots/mod-playerbots.git b6696bdbd3740e575598d167d69f39f68cc0b907
          clone_module mod-junk-to-gold https://github.com/noisiver/mod-junk-to-gold.git 2134690bb03899e5c9e44d0682e8e6abf0bbbaf2
          clone_module mod-multibot-bridge https://github.com/Wishmaster117/mod-multibot-bridge.git 759c100d5e508b9af28531a2642ded70619828ba
          clone_module mod-ah-bot-plus https://github.com/NathanHandley/mod-ah-bot-plus.git f685832994c825f90aa5a3dc0e1620aa568e875b
          clone_module mod-individual-progression https://github.com/ZhengPeiRu21/mod-individual-progression.git 977e2005bacf97f35e506eb27b8af6b2ea1136af
          clone_module mod-era-talents https://github.com/lathcf/azerothcore-mod-era-talents.git 3a0d9776c6837d8a5e5038c23c01c4fc388d90f8
          clone_module mod-dungeon-clear https://github.com/jrad7/mod-dungeon-clear.git 29c53fd10f99c1f978fba6cecd326bde8ce170d9
          for lm in mod-playerbot-chatter mod-raid-roster mod-admin-panel mod-ahbot-price mod-wintergrasp-bots mod-arena-roster mod-titan-rune; do
            rm -rf "$CORE/modules/$lm"
            cp -a "$GITHUB_WORKSPACE/modules/$lm" "$CORE/modules/$lm"
          done
          for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
            [[ -e "$patch" ]] || continue
            name="$(basename "$patch")"
            args=()
            if [[ "$name" == "0014-playerbot-sunwell.patch" || "$name" == "0016-playerbot-aq40-twins.patch" ]]; then
              args+=(--exclude=modules/mod-playerbots/src/Bot/PlayerbotAI.cpp)
            fi
            if git -C "$CORE" apply "${args[@]}" --reverse --check "$patch" >/dev/null 2>&1; then
              :
            elif git -C "$CORE" apply "${args[@]}" --check "$patch" >/dev/null 2>&1; then
              git -C "$CORE" apply "${args[@]}" "$patch"
            else
              git -C "$CORE" apply "${args[@]}" --check --verbose "$patch" || true
              exit 1
            fi
          done
          "$CORE/modules/mod-era-talents/apply-patches.sh" "$CORE"

      - name: Verify EraTalents relog persistence guard
        run: |
          set -euo pipefail
          ERA="$GITHUB_WORKSPACE/azerothcore-wotlk/modules/mod-era-talents/src"
          grep -q 'thread_local uint32 g_internalTalentResetDepth = 0' "$ERA/EraTransition.cpp"
          grep -q 'InternalTalentResetScope internalReset' "$ERA/EraTransition.cpp"
          grep -q 'bool IsInternalTalentReset()' "$ERA/EraTransition.cpp"
          grep -q 'if (EraTransition::IsInternalTalentReset())' "$ERA/EraTalentPin.cpp"
          grep -q 'if (noCost && !p->IsInWorld())' "$ERA/EraTalentPin.cpp"
          # Internal native-spec cleanup and login-time native resets must never delete the custom era talent rows.
          python3 - <<'PY'
          from pathlib import Path
          text = Path("azerothcore-wotlk/modules/mod-era-talents/src/EraTalentPin.cpp").read_text()
          hook = text[text.index("void OnPlayerTalentsReset"):text.index("private:", text.index("void OnPlayerTalentsReset"))]
          assert hook.index("IsInternalTalentReset") < hook.index("EraTalents::Reset"), hook
          print("EraTalents relog persistence guard contract passed")
          PY

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S "$GITHUB_WORKSPACE/azerothcore-wotlk" -B "$GITHUB_WORKSPACE/build" \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DAPPS_BUILD=all -DTOOLS_BUILD=none -DSCRIPTS=static -DMODULES=static \
            -DWITH_WARNINGS=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Werror -ferror-limit=0" \
            -DCMAKE_CXX_FLAGS="-Werror -ferror-limit=0"
      - name: Compile complete stack
        run: cmake --build "$GITHUB_WORKSPACE/build" --config Release -j 2