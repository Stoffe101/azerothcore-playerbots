name: One-shot Group Composer roster preview pooling fix

on:
  push:
    branches:
      - feature/group-composer-audit
    paths:
      - .github/workflows/group-composer-roster-pool-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/group-composer-audit
      - name: Pool preview roster rows
        shell: python
        run: |
          from pathlib import Path

          path = Path('client-addons-src/GroupComposer/UI.lua')
          text = path.read_text()
          start = text.index('local function DestroyRosterRows()')
          end = text.index('\n\nfunction UI:RefreshConfig()', start)
          new = r'''local function HideRosterRows()
    for _, row in ipairs(UI.rosterRows or {}) do row:Hide() end
    for _, row in ipairs(UI.rosterGroupRows or {}) do row:Hide() end
    if UI.rosterEmpty then UI.rosterEmpty:Hide() end
end

UI.rosterGroupRows = UI.rosterGroupRows or {}

local function AcquireRosterGroup(index)
    local holder = UI.rosterGroupRows[index]
    if holder then return holder end
    holder = CreateFrame("Frame", nil, rosterContent)
    holder:SetWidth(272); holder:SetHeight(20)
    local label = Text(holder, "", "GameFontNormalSmall", C.muted)
    label:SetPoint("LEFT", 2, 0)
    holder.label = label
    UI.rosterGroupRows[index] = holder
    return holder
end

local function AcquireRosterMember(index)
    local row = UI.rosterRows[index]
    if row then return row end

    row = CreateFrame("Frame", nil, rosterContent)
    row:SetWidth(272); row:SetHeight(28)
    local bg = Solid(row, "BACKGROUND", C.panel, 0.85); bg:SetAllPoints(row)
    local stripe = Solid(row, "ARTWORK", C.muted); stripe:SetPoint("TOPLEFT"); stripe:SetPoint("BOTTOMLEFT"); stripe:SetWidth(3)
    local name = Text(row, "", "GameFontHighlightSmall", C.text); name:SetPoint("LEFT", 8, 0); name:SetWidth(108); name:SetJustifyH("LEFT")
    local role = Text(row, "", "GameFontHighlightSmall", C.muted); role:SetPoint("LEFT", 120, 0); role:SetWidth(52); role:SetJustifyH("LEFT")
    local cls = Text(row, "", "GameFontHighlightSmall", C.muted); cls:SetPoint("LEFT", 176, 0); cls:SetWidth(72); cls:SetJustifyH("LEFT")
    local src = Text(row, "", "GameFontNormalSmall", C.muted); src:SetPoint("RIGHT", -6, 0)
    row.bg, row.stripe, row.nameText, row.roleText, row.classText, row.sourceText = bg, stripe, name, role, cls, src
    UI.rosterRows[index] = row
    return row
end

local function SetFontColor(font, color)
    font:SetTextColor(color[1], color[2], color[3], color[4] or 1)
end

local function RenderRoster(plan)
    HideRosterRows()
    local members, rowHeight, lastGroup, y = plan.members or {}, 28, -1, 0
    local memberIndex, groupIndex = 0, 0

    for index, member in ipairs(members) do
        if member.subgroup and member.subgroup > 0 and member.subgroup ~= lastGroup then
            lastGroup = member.subgroup
            groupIndex = groupIndex + 1
            local group = AcquireRosterGroup(groupIndex)
            group:ClearAllPoints(); group:SetPoint("TOPLEFT", 0, -y)
            group.label:SetText("Group " .. member.subgroup)
            group:Show()
            y = y + 20
        end

        memberIndex = memberIndex + 1
        local row = AcquireRosterMember(memberIndex)
        row:ClearAllPoints(); row:SetPoint("TOPLEFT", 0, -y)
        row.bg:SetTexture(index % 2 == 0 and C.panel2[1] or C.panel[1], index % 2 == 0 and C.panel2[2] or C.panel[2], index % 2 == 0 and C.panel2[3] or C.panel[3], 0.85)
        local color = ROLE_COLOR[member.role] or C.muted
        row.stripe:SetTexture(color[1], color[2], color[3], color[4] or 1)
        row.nameText:SetText(member.name or "?")
        SetFontColor(row.nameText, member.human and C.gold or C.text)
        row.roleText:SetText(RoleName(member.role)); SetFontColor(row.roleText, color)
        row.classText:SetText(D.CLASS_LABEL[member.class] or member.class or "?"); SetFontColor(row.classText, C.muted)
        local sourceLetter = member.human and "H" or (member.source == "GUILD" and "G" or "W")
        row.sourceText:SetText(sourceLetter)
        SetFontColor(row.sourceText, member.human and C.gold or (member.source == "GUILD" and C.green or C.blue))
        row:Show()
        y = y + rowHeight + 2
    end

    if #members == 0 then
        if not UI.rosterEmpty then
            local empty = Text(rosterContent, "", "GameFontHighlightSmall", C.dim)
            empty:SetPoint("TOPLEFT", 4, -8); empty:SetPoint("RIGHT", -8, 0); empty:SetJustifyH("LEFT")
            UI.rosterEmpty = empty
        end
        UI.rosterEmpty:SetText("No roster preview yet.\n\nFind Roster builds the team without inviting anyone.")
        UI.rosterEmpty:Show()
        y = 100
    end
    rosterContent:SetHeight(math.max(340, y + 12))
end'''
          path.write_text(text[:start] + new + text[end:])
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Group Composer CI'
          git config user.email 'actions@users.noreply.github.com'
          git add client-addons-src/GroupComposer/UI.lua
          git diff --cached --check
          git commit -m 'perf: reuse roster preview rows'
          git push origin HEAD:feature/group-composer-audit
