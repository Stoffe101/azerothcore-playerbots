name: Integration build

on:
  push:
    branches:
      - main
      - integration/bot-ai-refresh-2026-09-14
      - test/runtime-hardening-group-composer
      - test/group-composer-v4
  workflow_dispatch:
    inputs:
      runner:
        description: Build runner
        required: true
        default: auto
        type: choice
        options:
          - auto
          - local
          - github

permissions:
  contents: read

concurrency:
  group: integration-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Select build runner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runs_on: ${{ steps.select.outputs.runs_on }}
      is_local: ${{ steps.select.outputs.is_local }}
      parallel_jobs: ${{ steps.select.outputs.parallel_jobs }}
    steps:
      - name: Select local or GitHub-hosted runner
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          REQUESTED_RUNNER: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'auto' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          use_github() {
            echo 'runs_on=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
            echo 'is_local=false' >> "$GITHUB_OUTPUT"
            echo 'parallel_jobs=4' >> "$GITHUB_OUTPUT"
            echo "Selected GitHub-hosted ubuntu-24.04 runner."
          }

          use_local() {
            echo 'runs_on=["self-hosted","Linux","X64","wow-builder"]' >> "$GITHUB_OUTPUT"
            echo 'is_local=true' >> "$GITHUB_OUTPUT"
            echo 'parallel_jobs=8' >> "$GITHUB_OUTPUT"
            echo "Selected local stoffes-pc runner."
          }

          if [[ "$REQUESTED_RUNNER" == "auto" ]]; then
            if grep -Fq "[local-ci]" <<< "${COMMIT_MESSAGE:-}"; then
              REQUESTED_RUNNER="local"
              echo "Commit requested local CI override."
            elif grep -Fq "[github-ci]" <<< "${COMMIT_MESSAGE:-}"; then
              REQUESTED_RUNNER="github"
              echo "Commit requested GitHub-hosted CI override."
            fi
          fi

          case "$REQUESTED_RUNNER" in
            github)
              use_github
              exit 0
              ;;
            local)
              use_local
              exit 0
              ;;
            auto)
              ;;
            *)
              echo "Unknown runner selection: $REQUESTED_RUNNER" >&2
              exit 1
              ;;
          esac

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "RUNNER_STATUS_TOKEN is unavailable; safely falling back to GitHub-hosted."
            use_github
            exit 0
          fi

          DATA="$(
            curl -fsSL --retry 2 --retry-delay 1 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners" \
              || true
          )"

          AVAILABLE="$(
            jq -r '
              [.runners[]?
                | select(
                    .name == "stoffes-pc"
                    and .status == "online"
                    and .busy == false
                  )
              ] | length
            ' <<< "$DATA" 2>/dev/null || echo 0
          )"

          if [[ "$AVAILABLE" =~ ^[0-9]+$ ]] && (( AVAILABLE > 0 )); then
            use_local
          else
            echo "stoffes-pc is offline, busy, or runner status could not be read."
            use_github
          fi

  compile:
    name: Compile complete server stack
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runs_on) }}
    timeout-minutes: 100
    env:
      BUILD_IS_LOCAL: ${{ needs.route.outputs.is_local }}
      REQUESTED_PARALLEL_JOBS: ${{ needs.route.outputs.parallel_jobs }}

    steps:
      - name: Show selected runner
        shell: bash
        run: |
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Runner OS:   ${RUNNER_OS:-unknown}"
          echo "Local build: $BUILD_IS_LOCAL"
          echo "Requested parallel jobs: $REQUESTED_PARALLEL_JOBS"
          echo "CPU threads: $(nproc)"
          free -h || true

      - name: Checkout server overlay
        uses: actions/checkout@v4

      - name: Install build dependencies on GitHub-hosted runner
        if: needs.route.outputs.is_local != 'true'
        run: |
          sudo apt-get update
          sudo apt-get remove -y needrestart || true
          sudo apt-get install -y \
            ccache clang-18 cmake ninja-build make build-essential cmake-data \
            libboost-all-dev libbz2-dev libmysql++-dev libreadline-dev libssl-dev libtool \
            openssl zlib1g-dev libgoogle-perftools-dev libmysqlclient-dev libncurses-dev

      - name: Verify local build dependencies
        if: needs.route.outputs.is_local == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for command in git curl ccache clang-18 clang++-18 cmake ninja; do
            command -v "$command" >/dev/null || {
              echo "Missing required local dependency: $command" >&2
              exit 1
            }
          done
          test -d /usr/lib/gcc/x86_64-linux-gnu/15 || {
            echo "Missing GCC 15 runtime/development files required by local Clang 18." >&2
            exit 1
          }

          clang-18 --version | head -n 1
          cmake --version | head -n 1
          ninja --version
          ccache --version | head -n 1

          cat >/tmp/ci-filesystem-test.cpp <<'EOF'
          #include <filesystem>
          int main()
          {
              std::filesystem::path p{"test"};
              return p.empty() ? 1 : 0;
          }
          EOF

          clang++-18 \
            --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/15 \
            -std=c++20 \
            /tmp/ci-filesystem-test.cpp \
            -o /tmp/ci-filesystem-test
          /tmp/ci-filesystem-test

      - name: Restore GitHub compiler cache
        if: needs.route.outputs.is_local != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ac-clang18-ccache-${{ runner.os }}-${{ hashFiles('.github/workflows/integration-build.yml') }}
          restore-keys: |
            ac-clang18-ccache-${{ runner.os }}-

      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          ccache --set-config=compression=true
          if [[ "$BUILD_IS_LOCAL" == "true" ]]; then
            ccache --max-size=10G
          else
            ccache --max-size=4G
          fi
          ccache --zero-stats
          ccache --show-config | grep -E 'cache_dir|compression|max_size|direct_mode' || true

      - name: Assemble exact pinned AzerothCore tree
        shell: bash
        run: |
          set -euo pipefail
          CORE="$GITHUB_WORKSPACE/azerothcore-wotlk"
          rm -rf "$CORE"

          git clone https://github.com/mod-playerbots/azerothcore-wotlk.git "$CORE"
          git -C "$CORE" checkout 06234df3d5ab26c93f4f1f06f3edb828b73ecd3c

          clone_module() {
            local name="$1" url="$2" pin="${3:-}"
            git clone "$url" "$CORE/modules/$name"
            if [[ -n "$pin" ]]; then
              git -C "$CORE/modules/$name" checkout "$pin"
            fi
          }

          clone_module mod-playerbots https://github.com/mod-playerbots/mod-playerbots.git b6696bdbd3740e575598d167d69f39f68cc0b907
          clone_module mod-junk-to-gold https://github.com/noisiver/mod-junk-to-gold.git 2134690bb03899e5c9e44d0682e8e6abf0bbbaf2
          clone_module mod-multibot-bridge https://github.com/Wishmaster117/mod-multibot-bridge.git 759c100d5e508b9af28531a2642ded70619828ba
          clone_module mod-ah-bot-plus https://github.com/NathanHandley/mod-ah-bot-plus.git f685832994c825f90aa5a3dc0e1620aa568e875b
          clone_module mod-individual-progression https://github.com/ZhengPeiRu21/mod-individual-progression.git 977e2005bacf97f35e506eb27b8af6b2ea1136af
          clone_module mod-era-talents https://github.com/lathcf/azerothcore-mod-era-talents.git 3a0d9776c6837d8a5e5038c23c01c4fc388d90f8
          clone_module mod-dungeon-clear https://github.com/jrad7/mod-dungeon-clear.git 29c53fd10f99c1f978fba6cecd326bde8ce170d9

          for lm in mod-playerbot-chatter mod-raid-roster mod-admin-panel mod-ahbot-price mod-wintergrasp-bots mod-arena-roster mod-titan-rune; do
            rm -rf "$CORE/modules/$lm"
            cp -a "$GITHUB_WORKSPACE/modules/$lm" "$CORE/modules/$lm"
          done

          # Match setup.sh/update.sh exactly. The large Sunwell and AQ40 patches were authored
          # around nearby upstream PlayerbotAI strategy-list changes, so their tiny PlayerbotAI
          # edits are owned by 0014a/0016a compatibility patches against this exact pinned module.
          for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
            [[ -e "$patch" ]] || continue
            name="$(basename "$patch")"
            apply_args=()
            if [[ "$name" == "0014-playerbot-sunwell.patch" || "$name" == "0016-playerbot-aq40-twins.patch" ]]; then
              apply_args+=(--exclude=modules/mod-playerbots/src/Bot/PlayerbotAI.cpp)
            fi

            if git -C "$CORE" apply "${apply_args[@]}" --reverse --check "$patch" >/dev/null 2>&1; then
              echo "Patch already present upstream: $name"
            elif git -C "$CORE" apply "${apply_args[@]}" --check "$patch" >/dev/null 2>&1; then
              git -C "$CORE" apply "${apply_args[@]}" "$patch"
              echo "Applied wrapper patch: $name"
            else
              echo "ERROR: patch no longer applies cleanly: $name" >&2
              git -C "$CORE" apply "${apply_args[@]}" --check --verbose "$patch" || true
              exit 1
            fi
          done

          if [[ -x "$CORE/modules/mod-era-talents/apply-patches.sh" ]]; then
            "$CORE/modules/mod-era-talents/apply-patches.sh" "$CORE"
          fi

      - name: Configure
        shell: bash
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/dist"

          TOOLCHAIN_FLAGS=""
          if [[ "$BUILD_IS_LOCAL" == "true" ]]; then
            TOOLCHAIN_FLAGS="--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/15"
            echo "Local Ubuntu 26.04 runner: pinning Clang 18 to GCC 15 libstdc++."
          fi

          cmake -S "$GITHUB_WORKSPACE/azerothcore-wotlk" -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist" \
            -DAPPS_BUILD=all \
            -DTOOLS_BUILD=none \
            -DSCRIPTS=static \
            -DMODULES=static \
            -DWITH_WARNINGS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$TOOLCHAIN_FLAGS -Werror -ferror-limit=0" \
            -DCMAKE_CXX_FLAGS="$TOOLCHAIN_FLAGS -Werror -ferror-limit=0"

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail

          CPU_JOBS="$(nproc)"
          MEM_KB="$(awk '/MemTotal:/ { print $2 }' /proc/meminfo)"
          MEM_JOBS=$(( MEM_KB / 2500000 ))

          if (( MEM_JOBS < 2 )); then
            MEM_JOBS=2
          fi

          JOBS="$REQUESTED_PARALLEL_JOBS"
          if (( JOBS > CPU_JOBS )); then JOBS="$CPU_JOBS"; fi
          if (( JOBS > MEM_JOBS )); then JOBS="$MEM_JOBS"; fi
          if (( JOBS < 2 )); then JOBS=2; fi

          echo "Building with $JOBS parallel jobs (CPU=$CPU_JOBS, memory-safe=$MEM_JOBS)."
          cmake --build "$GITHUB_WORKSPACE/build" --config Release --parallel "$JOBS"

      - name: Install build
        run: cmake --install "$GITHUB_WORKSPACE/build" --config Release

      - name: Static deployment checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n setup.sh update.sh configure-living-world-bots.sh
          SETUP_PREFLIGHT_ONLY=1 ./setup.sh
          test -x dist/bin/worldserver
          test -x dist/bin/authserver
          test -f patches/0014a-playerbot-sunwell-playerbotai-compat.patch
          test -f patches/0016a-playerbot-aq40-playerbotai-compat.patch
          test -f modules/mod-titan-rune/src/TitanRuneDevice.cpp
          test -f modules/mod-titan-rune/src/TitanRuneFrostArcane.cpp
          test -f modules/mod-titan-rune/src/TitanRunePlagueGladiator.cpp
          test -f modules/mod-titan-rune/src/TitanRuneAlphaTitan.cpp
          test -f modules/mod-titan-rune/src/TitanRunePurifiedEnergy.cpp
          test -f modules/mod-titan-rune/src/TitanRunePendingRewards.cpp
          test ! -e modules/mod-titan-rune/src/TitanRuneFamilies.cpp
          test -f modules/mod-titan-rune/data/sql/db-characters/base/2026_09_15_00_titan_rune_pending_rewards.sql
          test -f modules/mod-titan-rune/data/sql/db-world/base/2026_09_14_03_titan_rune_full_vendor_catalog.sql
          test -f modules/mod-titan-rune/data/sql/db-world/base/2026_09_15_00_titan_rune_device.sql
          test -f modules/mod-titan-rune/data/sql/db-world/base/2026_09_15_01_titan_rune_titan_support.sql
          test -f modules/mod-titan-rune/data/sql/db-world/base/2026_09_15_03_titan_rune_gamma_signets.sql

      - name: Show compiler cache statistics
        if: always()
        shell: bash
        run: ccache --show-stats || true
