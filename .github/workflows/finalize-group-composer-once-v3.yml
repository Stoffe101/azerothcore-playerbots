name: Finalize Group Composer once v3

on:
  push:
    branches:
      - test/runtime-hardening-group-composer
    paths:
      - .github/workflows/finalize-group-composer-once-v3.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/runtime-hardening-group-composer

      - name: Apply source hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {found}\n--- needle ---\n{old}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          command = "modules/mod-raid-roster/src/GroupComposerCommand.cpp"
          replace_exact(command,
          '''    uint8 spec = ANY_SPEC;
              uint32 elapsed = 0;
          ''',
          '''    uint8 spec = ANY_SPEC;
              bool fullRebuild = false;
              uint32 elapsed = 0;
          ''')

          replace_exact(command,
          '''char const* SourceToken(Member const& member)
          {
              if (member.human) return "HUMAN";
              if (member.guild) return "GUILD";
              if (member.managed) return "ROSTER";
              return "WORLD";
          }
          ''',
          '''char const* SourceToken(Member const& member)
          {
              if (member.human) return "HUMAN";
              if (member.guild) return "GUILD";
              if (member.reserve) return "RESERVE";
              if (member.managed) return "ROSTER";
              return "WORLD";
          }
          ''')

          replace_exact(command,
          '''        handler->PSendSysMessage("[GC]|MEMBER|{}|{}|{}|{}|{}|{}|{}|{}|{}",
                      uint32(member.subgroup), Sanitize(member.name), RoleToken(member.role), ClassToken(member.cls),
                      SpecName(member.cls, member.spec), SourceToken(member), member.human ? 1 : 0,
                      member.locked ? 1 : 0, member.pinned ? 1 : 0);
          ''',
          '''        handler->PSendSysMessage("[GC]|MEMBER|{}|{}|{}|{}|{}|{}|{}|{}|{}|{}|{}",
                      uint32(member.subgroup), Sanitize(member.name), RoleToken(member.role), ClassToken(member.cls),
                      SpecName(member.cls, member.spec), SourceToken(member), member.human ? 1 : 0,
                      member.locked ? 1 : 0, member.pinned ? 1 : 0, member.needsPreparation ? 1 : 0,
                      member.reserve ? 1 : 0);
          ''')

          replace_exact(command,
          '''void SyncManagedBot(Player* master, Player* bot, uint8 role, uint8 spec)
          {
              if (!master || !bot) return;
              (void)role; // carried explicitly now; role-aware build/gear finalization consumes it next
              if (spec > 2) spec = Planner::InferSpec(bot);
              if (spec > 2) return;

              PlayerbotFactory factory(bot, master->GetLevel(), ITEM_QUALITY_LEGENDARY, 0);
              factory.Randomize(false);
              if (!EraTalentBots::FactoryReconcile(bot, spec)) PlayerbotFactory::InitTalentsBySpecNo(bot, spec, true);
              if (PlayerbotAI* ai = GET_PLAYERBOT_AI(bot)) ai->ResetStrategies(false);
              RaidRosterGear::EquipForSpec(bot, master, spec);
              factory.ApplyEnchantAndGemsNew();
              factory.InitAmmo();

              if (bot->IsClass(CLASS_DEATH_KNIGHT))
              {
                  uint32 quest = bot->GetTeamId(true) == TEAM_ALLIANCE ? 13188 : 13189;
                  if (!bot->IsQuestRewarded(quest)) bot->SetRewardedQuest(quest);
              }
              RaidRosterEra::SyncBotToMaster(master, bot);
          }
          ''',
          '''void SyncManagedBot(Player* master, Player* bot, uint8 role, uint8 spec, bool fullRebuild)
          {
              if (!master || !bot) return;
              if (spec > 2) spec = Planner::InferSpec(bot);
              if (spec > 2) return;

              // Reserve capacity may need full provisioning. Persistent companions may be
              // retasked for combat, but their quests, professions and inventory history
              // must never be broadly randomized by Group Composer.
              PlayerbotFactory factory(bot, master->GetLevel(), ITEM_QUALITY_LEGENDARY, 0);
              if (fullRebuild) factory.Randomize(false);

              // Playerbots / Era Talents use pseudo-spec 3 for Feral Cat PvE. Keep the
              // public Composer spec as Feral (1) and use role only for build selection.
              uint8 buildSpec = spec;
              if (bot->IsClass(CLASS_DRUID) && spec == 1 && role == ROLE_DPS) buildSpec = 3;

              if (!EraTalentBots::FactoryReconcile(bot, buildSpec))
                  PlayerbotFactory::InitTalentsBySpecNo(bot, buildSpec, true);
              if (PlayerbotAI* ai = GET_PLAYERBOT_AI(bot)) ai->ResetStrategies(false);
              factory.InitGlyphs(false);
              RaidRosterGear::EquipForSpec(bot, master, spec);
              factory.ApplyEnchantAndGemsNew();
              factory.InitAmmo();

              if (bot->IsClass(CLASS_DEATH_KNIGHT))
              {
                  uint32 quest = bot->GetTeamId(true) == TEAM_ALLIANCE ? 13188 : 13189;
                  if (!bot->IsQuestRewarded(quest)) bot->SetRewardedQuest(quest);
              }
              RaidRosterEra::SyncBotToMaster(master, bot);
          }
          ''')

          replace_exact(command,
              '                SyncManagedBot(master, bot, itr->second.role, itr->second.spec);\n',
              '                SyncManagedBot(master, bot, itr->second.role, itr->second.spec, itr->second.fullRebuild);\n')
          replace_exact(command,
              '            SyncManagedBot(master, bot, member.role, member.spec);\n',
              '            SyncManagedBot(master, bot, member.role, member.spec, member.reserve);\n')
          replace_exact(command,
              '        s_pendingSync[member.guid.GetCounter()] = { owner, member.role, member.spec, 0 };\n',
              '        s_pendingSync[member.guid.GetCounter()] = { owner, member.role, member.spec, member.reserve, 0 };\n')

          core = "client-addons-src/GroupComposer/Core.lua"
          replace_exact(core,
              '            human = fields[8] == "1", locked = fields[9] == "1", pinned = fields[10] == "1",\n',
              '            human = fields[8] == "1", locked = fields[9] == "1", pinned = fields[10] == "1",\n            needsPreparation = fields[11] == "1", reserve = fields[12] == "1",\n')

          policy = "client-addons-src/GroupComposer/ComposerPolicy.lua"
          replace_exact(policy,
          '''    return counts
          end

          -- Exact class/spec rows describe BOT slots.''',
          '''    return counts
          end
          Policy.HumanRoleCounts = HumanRoleCounts

          -- Exact class/spec rows describe BOT slots.''')

          dashboard = "client-addons-src/GroupComposer/DashboardV3.lua"
          replace_exact(dashboard,
          '''local function HumanRoleProblems()
              if GC.Policy and GC.Policy.HumanRoleProblems then return GC.Policy:HumanRoleProblems() end
              return {}
          end

          local function ExpandedRequired(role)
          ''',
          '''local function HumanRoleProblems()
              if GC.Policy and GC.Policy.HumanRoleProblems then return GC.Policy:HumanRoleProblems() end
              return {}
          end

          local function RemainingBotSlots(role)
              local config = GC:GetConfig()
              local target = role == "TANK" and (tonumber(config.tanks) or 0)
                  or role == "HEALER" and (tonumber(config.healers) or 0)
                  or (tonumber(config.dps) or 0)
              local humans = GC.Policy and GC.Policy.HumanRoleCounts and GC.Policy.HumanRoleCounts(config) or {}
              return math.max(0, target - (tonumber(humans[role]) or 0))
          end

          local function ExpandedRequired(role)
          ''')

          replace_exact(dashboard,
          '''    function p:Refresh()
                  local slots = ExpandedRequired(role)
                  for i, row in ipairs(self.rows) do
                      local s = slots[i]
                      row.class = s and s.class or "ANY"; row.spec = s and s.spec or "ANY"
                      row.classDD:Refresh(); row.specDD:Refresh()
                  end
              end
          ''',
          '''    function p:Refresh()
                  local slots = ExpandedRequired(role)
                  local remaining = RemainingBotSlots(role)
                  sub:SetText(tostring(remaining) .. (remaining == 1 and " bot slot" or " bot slots"))
                  for i, row in ipairs(self.rows) do
                      local s = i <= remaining and slots[i] or nil
                      row.class = s and s.class or "ANY"; row.spec = s and s.spec or "ANY"
                      row.classDD:Refresh(); row.specDD:Refresh()
                      if i <= remaining then row:Show() else row:Hide() end
                  end
              end
          ''')

          replace_exact(dashboard,
              '    local out = {}; for _, row in ipairs(dRolePanels[role].rows) do out[#out + 1] = {class = row.class, spec = row.spec} end\n    WriteRequired(role, out)\n',
              '    local out, remaining = {}, RemainingBotSlots(role)\n    for i, row in ipairs(dRolePanels[role].rows) do\n        if i <= remaining then out[#out + 1] = {class = row.class, spec = row.spec} end\n    end\n    WriteRequired(role, out)\n')

          replace_exact(dashboard,
              '        local target = role == "TANK" and GC:GetConfig().tanks or role == "HEALER" and GC:GetConfig().healers or GC:GetConfig().dps\n        local exactCount = 0; for _, r in ipairs(rows) do exactCount = exactCount + r.count end\n        self.cap:SetText(exactCount .. " exact / " .. target .. " total")\n',
              '        local target = RemainingBotSlots(role)\n        local exactCount = 0; for _, r in ipairs(rows) do exactCount = exactCount + r.count end\n        self.cap:SetText(exactCount .. " exact / " .. target .. " bot slots")\n        self.add:SetEnabledState(exactCount < target)\n')

          old_target_now = 'local targetNow = role == "TANK" and GC:GetConfig().tanks or role == "HEALER" and GC:GetConfig().healers or GC:GetConfig().dps'
          replace_exact(dashboard, old_target_now, 'local targetNow = RemainingBotSlots(role)', count=2)

          replace_exact(dashboard,
              '            row.source:SetText(member.human and "HUMAN" or member.source == "GUILD" and "GUILD" or member.source == "ROSTER" and "PREP" or "WORLD")\n',
              '            local source = member.human and "HUMAN" or member.reserve and "RESERVE" or member.source == "GUILD" and "GUILD" or member.source == "ROSTER" and "ROSTER" or "WORLD"\n            if not member.human then source = source .. (member.needsPreparation and " PREP" or " READY") end\n            row.source:SetText(source)\n')

          replace_exact(dashboard,
              '    dCount:SetText(tostring(plan.summary and plan.summary.total or #(plan.members or {})) .. " / 5")\n',
              '    dCount:SetText(tostring(plan.summary and plan.summary.total or #(plan.members or {})) .. " / 5")\n    dRoleCount:SetText("Bots needed: " .. RemainingBotSlots("TANK") .. " T  •  " .. RemainingBotSlots("HEALER") .. " H  •  " .. RemainingBotSlots("DPS") .. " D")\n')
          replace_exact(dashboard,
              '    rsRoles:SetText(tostring(c.tanks) .. " Tank  •  " .. tostring(c.healers) .. " Heal  •  " .. tostring(c.dps) .. " DPS")\n',
              '    rsRoles:SetText("Bots: " .. RemainingBotSlots("TANK") .. " T  •  " .. RemainingBotSlots("HEALER") .. " H  •  " .. RemainingBotSlots("DPS") .. " D")\n')
          replace_exact(dashboard,
              'local exHint = Text(exact, "Add exact builds such as Fire Mage ×6 or Discipline Priest ×1. Unspecified role slots are auto-filled.", "GameFontHighlightSmall", C.muted); exHint:SetPoint("TOPLEFT", exTitle, "BOTTOMLEFT", 0, -3)\n',
              'local exHint = Text(exact, "Exact rows are bot slots only; human anchors already consume their roles. Unspecified bot slots are auto-filled.", "GameFontHighlightSmall", C.muted); exHint:SetPoint("TOPLEFT", exTitle, "BOTTOMLEFT", 0, -3)\n')

          tests = "client-addons-src/GroupComposer/tests/test_server_contract.py"
          replace_exact(tests,
              'ADVANCED = (ROOT / "client-addons-src/GroupComposer/Advanced.lua").read_text(encoding="utf-8")\nSERVER =',
              'ADVANCED = (ROOT / "client-addons-src/GroupComposer/Advanced.lua").read_text(encoding="utf-8")\nCORE = (ROOT / "client-addons-src/GroupComposer/Core.lua").read_text(encoding="utf-8")\nPOLICY = (ROOT / "client-addons-src/GroupComposer/ComposerPolicy.lua").read_text(encoding="utf-8")\nDASHBOARD = (ROOT / "client-addons-src/GroupComposer/DashboardV3.lua").read_text(encoding="utf-8")\nSERVER =')

          marker = '''assert "ProjectCandidateForRole(candidate, role, required, projected)" in retask, (
              "Required class/spec selection bypasses the same deterministic role projection path"
          )

          # Utility coverage'''
          insertion = '''assert "ProjectCandidateForRole(candidate, role, required, projected)" in retask, (
              "Required class/spec selection bypasses the same deterministic role projection path"
          )

          # Preparation is allowed to rebuild combat state, not a persistent companion's life history.
          sync = section(SERVER, "void SyncManagedBot(", "void ApplyGroupSettings(")
          assert "bool fullRebuild" in sync, "Managed preparation lost the reserve-only full rebuild boundary"
          assert "if (fullRebuild) factory.Randomize(false);" in sync
          assert sync.count("factory.Randomize(false)") == 1, "Full randomization must have one guarded call site"
          assert "CLASS_DRUID" in sync and "role == ROLE_DPS" in sync and "buildSpec = 3" in sync, (
              "Feral DPS no longer maps to Playerbots/Era Talents Cat pseudo-spec 3"
          )
          assemble = section(SERVER, "bool GroupComposerCommand::HandleAssemble", "bool GroupComposerCommand::HandleQueue")
          assert "member.reserve" in assemble, "Reserve identity is not carried into assembly-time preparation"
          assert "bool fullRebuild = false;" in SERVER and "itr->second.fullRebuild" in SERVER
          assert 'if (member.reserve) return "RESERVE";' in SERVER
          assert 'needsPreparation = fields[11] == "1"' in CORE and 'reserve = fields[12] == "1"' in CORE
          assert "Policy.HumanRoleCounts = HumanRoleCounts" in POLICY
          assert 'local function RemainingBotSlots(role)' in DASHBOARD
          assert 'RemainingBotSlots("TANK")' in DASHBOARD and 'RemainingBotSlots("HEALER")' in DASHBOARD

          # Utility coverage'''
          replace_exact(tests, marker, insertion)
          PY

      - name: Verify focused contracts
        run: |
          python3 client-addons-src/GroupComposer/tests/test_server_contract.py
          git diff --check

      - name: Commit source hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/mod-raid-roster/src/GroupComposerCommand.cpp \
                  client-addons-src/GroupComposer/Core.lua \
                  client-addons-src/GroupComposer/ComposerPolicy.lua \
                  client-addons-src/GroupComposer/DashboardV3.lua \
                  client-addons-src/GroupComposer/tests/test_server_contract.py
          git diff --cached --check
          git commit -m "fix(group-composer): preserve companions during role preparation"
          git push origin HEAD:test/runtime-hardening-group-composer
