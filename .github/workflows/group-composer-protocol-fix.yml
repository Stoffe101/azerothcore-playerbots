name: One-shot Group Composer protocol batching fix

on:
  push:
    branches:
      - feature/group-composer-audit
    paths:
      - .github/workflows/group-composer-protocol-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/group-composer-audit
      - name: Batch multipart roster protocol rendering
        shell: python
        run: |
          from pathlib import Path
          path = Path('client-addons-src/GroupComposer/Core.lua')
          text = path.read_text()
          old = '''    if kind ~= "ANCHOR" and kind ~= "ANCHORRESET" and kind ~= "ANCHORDONE" then GC:Fire("PLAN_CHANGED", GC.plan) end
              return true
          end
          '''
          new = '''    -- META/MEMBER/COVERAGE/WARN form one multipart server snapshot. Rendering after every
              -- member makes a 25/40-player preview rebuild its roster frames dozens of times and causes
              -- visible hitching plus unnecessary hidden-frame churn on the 3.3.5a client. RESET clears
              -- the previous preview immediately; READY publishes the complete new snapshot once.
              if kind == "RESET" or kind == "READY" or kind == "ERROR" then
                  GC:Fire("PLAN_CHANGED", GC.plan)
              end
              return true
          end
          '''
          if old not in text:
              raise SystemExit('Expected protocol refresh block not found; refusing a blind edit')
          path.write_text(text.replace(old, new, 1))
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Group Composer CI'
          git config user.email 'actions@users.noreply.github.com'
          git add client-addons-src/GroupComposer/Core.lua
          git diff --cached --check
          git commit -m 'perf: batch multipart roster protocol rendering'
          git push origin HEAD:feature/group-composer-audit
