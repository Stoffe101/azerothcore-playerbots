name: Stage Group Composer V4 backend

on:
  push:
    branches:
      - test/group-composer-v4

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Apply V4 backend stages
        run: |
          set -euo pipefail
          if ! grep -q 'void SendProgress' modules/mod-raid-roster/src/GroupComposerCommand.cpp; then
            python3 .github/scripts/apply_group_composer_v4_backend.py
            python3 .github/scripts/apply_group_composer_v4_contract.py
          fi
          if ! grep -q 'rejectedCandidates' modules/mod-raid-roster/src/GroupComposerTypes.h; then
            python3 .github/scripts/apply_group_composer_v4_replacement.py
          fi
          if ! grep -q 'bool TeleportCompletedPlan' modules/mod-raid-roster/src/GroupComposerCommand.cpp; then
            python3 .github/scripts/apply_group_composer_v4_travel.py
          fi
          python3 .github/scripts/fix_group_composer_v4_travel_contract.py

      - name: Focused source checks
        run: |
          set -euo pipefail
          python3 client-addons-src/GroupComposer/tests/test_server_contract.py
          python3 tools/generate-era-item-provenance.py --self-test
          python3 -m json.tool data/era-item-provenance/sources.json >/dev/null
          bash -n configure-era-item-provenance.sh
          bash -n configure-ahbot.sh
          grep -q 'EraProvenanceDisabledItemIDs' patches/0043-ahbot-era-provenance-filter.patch
          python3 -m py_compile tools/apply-playerbot-era-item-policy.py
          python3 -m py_compile wowsims-service/app.py
          python3 -m py_compile wowsims-service/harvest_presets.py
          python3 wowsims-service/harvest_presets.py --self-test
          python3 -m py_compile tools/verify-wowsims-model-support.py
          python3 tools/verify-wowsims-model-support.py
          python3 -m unittest discover -s wowsims-service/tests -v
          cmp data/wowsims/sources.json wowsims-service/sources.json
          cmp data/wowsims/model-support.json wowsims-service/model-support.json
          bash -n configure-wowsims-service.sh
          WOWSIMS_RENDER="$(./configure-wowsims-service.sh --render)"
          grep -q 'ac-wowsims:' <<< "$WOWSIMS_RENDER"
          grep -q 'expose:' <<< "$WOWSIMS_RENDER"
          ! grep -q 'ports:' <<< "$WOWSIMS_RENDER"
          grep -q 'ARG CLASSIC_COMMIT=7779ebbf79dc7f1341e6ab939b28a3402c9a730a' wowsims-service/Dockerfile
          grep -q 'ARG TBC_COMMIT=a4768c9d7ed51f4e49b8e90425f68ab47bde0cbc' wowsims-service/Dockerfile
          grep -q 'ARG WOTLK_COMMIT=563e4a08cb15729f1fdcbcf68e6d68224553bfef' wowsims-service/Dockerfile
          grep -q '/v1/snapshot/validate' wowsims-service/app.py
          grep -q '/v1/snapshot/request' wowsims-service/app.py
          grep -q '/v1/snapshot/candidate-request' wowsims-service/app.py
          grep -q 'CANDIDATE_REQUEST_BUILT_UNVALIDATED' wowsims-service/app.py
          grep -q '/v1/snapshot/bag-candidates' wowsims-service/app.py
          grep -q 'BAG_CANDIDATES_BUILT_UNVALIDATED' wowsims-service/app.py
          grep -q '/v1/snapshot/compare-bags' wowsims-service/app.py
          grep -q 'BAG_COMPARE_COMPLETE_UNVALIDATED' wowsims-service/app.py
          grep -q 'compare_bag_candidates' wowsims-service/app.py
          grep -q 'baselineFingerprint' wowsims-service/app.py
          grep -q 'candidate mutation changed data outside the intended equipment slot' wowsims-service/app.py
          grep -q 'REQUEST_BUILT_UNVALIDATED' wowsims-service/app.py
          grep -q 'WOWSIMS_REQUIRE_GLYPH_MAP=1' wowsims-service/Dockerfile
          grep -q 'wotlk-glyph-id-map.json' wowsims-service/Dockerfile
          grep -q '/v1/models' wowsims-service/app.py
          grep -q '/v1/presets' wowsims-service/app.py
          grep -q 'SKRRA_WOWSIM_DUMP_DIR' wowsims-service/harvest_presets.py
          grep -q 'equivalent-after-authoritative-overlay' wowsims-service/harvest_presets.py
          grep -q 'distinct-authoritative-glyph-variant' wowsims-service/harvest_presets.py
          grep -q 'closest-live-character' wowsims-service/app.py
          grep -q 'selectableRouteCount' wowsims-service/app.py
          grep -q 'WOWSIMS_REQUIRE_PRESETS=1' wowsims-service/Dockerfile
          grep -q 'protobuf-compiler' wowsims-service/Dockerfile
          grep -q 'protoc-gen-go@v1.36.10' wowsims-service/Dockerfile
          grep -q 'go build --tags=with_db' wowsims-service/Dockerfile
          grep -q 'ENGINE_PRESENT_UNVALIDATED' data/wowsims/model-support.json
          grep -q '076c8773ab4c93ed8b2876a3c55f94267bbf1e85' data/wowsims/model-support.json
          grep -q 'BuildCharacterSnapshot' modules/mod-raid-roster/src/WoWSimsService.cpp
          grep -q 'BuildBaselineRequest' modules/mod-raid-roster/src/WoWSimsService.cpp
          grep -q '"request", HandleRequest' modules/mod-raid-roster/src/WoWSimsCommand.cpp
          grep -q 'BuildBagCandidateManifest' modules/mod-raid-roster/src/WoWSimsService.cpp
          grep -q 'CandidateWouldChangeSecondSlot' modules/mod-raid-roster/src/WoWSimsService.cpp
          grep -q 'EraPolicy::IsItemAllowed' modules/mod-raid-roster/src/WoWSimsService.cpp
          grep -q 'QueueBagComparison' modules/mod-raid-roster/src/WoWSimsService.cpp
          grep -q 'TickAsyncResults' modules/mod-raid-roster/src/WoWSimsService.cpp
          grep -q 'StartAsyncWorker' modules/mod-raid-roster/src/RaidRosterLoader.cpp
          grep -q 'StopAsyncWorker' modules/mod-raid-roster/src/RaidRosterLoader.cpp
          grep -q '"bags", HandleBags' modules/mod-raid-roster/src/WoWSimsCommand.cpp
          grep -q '"simbags", HandleSimBags' modules/mod-raid-roster/src/WoWSimsCommand.cpp
          grep -q 'SOCK_ENCHANTMENT_SLOT_3' modules/mod-raid-roster/src/WoWSimsService.cpp
          grep -q 'sSpellItemEnchantmentStore' modules/mod-raid-roster/src/WoWSimsService.cpp
          grep -q 'BuildTalentString' modules/mod-raid-roster/src/WoWSimsService.cpp
          grep -q 'RaidRoster.WoWSimsUrl' modules/mod-raid-roster/conf/mod_raid_roster.conf.dist
          grep -q 'new WoWSimsCommand()' modules/mod-raid-roster/src/RaidRosterLoader.cpp
          grep -q 'SetItemPolicyPredicates' tools/apply-playerbot-era-item-policy.py
          grep -q 'IsExternalItemPolicyReady' tools/apply-playerbot-era-item-policy.py
          grep -q 'IsItemAllowedByExternalPolicy' tools/apply-playerbot-era-item-policy.py
          grep -q 'AuctionHouseBot.EraProvenanceDisabledItemIDs' configure-ahbot.sh
          grep -q 'EraPolicy.ItemProvenance.DisabledVanillaItemIDs' configure-era-item-provenance.sh
          git diff --check
          grep -q 'group->AddMember(bot)' modules/mod-raid-roster/src/GroupComposerCommand.cpp
          grep -q 'AddPlayerBot(member.guid, account, true)' modules/mod-raid-roster/src/GroupComposerCommand.cpp
          grep -q 'groupComposerSilent' patches/0035-playerbot-group-composer-silent-login.patch
          grep -q 'PROGRESS' modules/mod-raid-roster/src/GroupComposerCommand.cpp
          ! grep -q 'InviteToGroupAction' modules/mod-raid-roster/src/GroupComposerCommand.cpp
          grep -q 'prepared previews stay reserved for three minutes' modules/mod-raid-roster/src/GroupComposerReserve.cpp
          grep -q 'AvailableTo' modules/mod-raid-roster/src/GroupComposerReserve.cpp
          grep -q 'addclassCache' modules/mod-raid-roster/src/GroupComposerPlanner.cpp
          ! grep -q 'PruneUnselectedBots' modules/mod-raid-roster/src/GroupComposerCommand.cpp
          ! grep -q 'ReplaceUnreadyCandidates' modules/mod-raid-roster/src/GroupComposerCommand.cpp
          grep -q 'GetMapEntranceTrigger(mapId)' modules/mod-raid-roster/src/GroupComposerCommand.cpp
          grep -q 'TeleportCompletedPlan' modules/mod-raid-roster/src/GroupComposerCommand.cpp
          grep -q 'TitanRune::SaveSelectedMode(travelLeader, titanMode)' modules/mod-raid-roster/src/GroupComposerCommand.cpp
          grep -q 'Player\* travelLeader = group->GetLeader()' modules/mod-raid-roster/src/GroupComposerCommand.cpp
          grep -q 'SendProtocol(master, "STATUS", travelError)' modules/mod-raid-roster/src/GroupComposerCommand.cpp
          grep -q 'HandleTeleport' modules/mod-raid-roster/src/GroupComposerCommand.cpp
          grep -q 'plan.assembled = true' modules/mod-raid-roster/src/GroupComposerCommand.cpp
          grep -q 'Teleport to Instance' client-ui/src/components/ModernDashboard.ts
          ! grep -q 'press Enter Activity to retry' modules/mod-raid-roster/src/GroupComposerCommand.cpp
          ! grep -Fxq 'DashboardV4.lua' client-addons-src/GroupComposer/GroupComposer.toc

      - name: Build WoWSims service image when simulator inputs change
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          NEED_BUILD=1
          if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            if git diff --quiet "$BEFORE" "${GITHUB_SHA}" -- \
              wowsims-service/Dockerfile \
              wowsims-service/app.py \
              wowsims-service/harvest_presets.py \
              wowsims-service/model-support.json \
              wowsims-service/sources.json \
              data/wowsims/model-support.json \
              data/wowsims/sources.json; then
              NEED_BUILD=0
            fi
          fi
          if [[ "$NEED_BUILD" == "0" ]]; then
            echo "WoWSims runtime inputs unchanged; skipping image build."
            exit 0
          fi
          IMAGE="skrra-wowsims-ci:${GITHUB_SHA}"
          docker build --progress=plain -t "$IMAGE" ./wowsims-service
          docker run --rm "$IMAGE" python -c 'import app; m=app.load_manifest(); r=app.SimRunner(m); h=r.health(); assert h["ready"]; assert all(v["ready"] and v["selectableRouteCount"] == v["routeCount"] for v in h["presets"]["eras"].values()); print(h["presets"])'

      - name: Commit generated backend changes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'V4 backend stages already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            modules/mod-raid-roster/src/GroupComposerCommand.cpp \
            modules/mod-raid-roster/src/GroupComposerReserve.cpp \
            modules/mod-raid-roster/src/GroupComposerPlanner.cpp \
            modules/mod-raid-roster/src/GroupComposerPlanner.h \
            modules/mod-raid-roster/src/GroupComposerTypes.h \
            client-addons-src/GroupComposer/Core.lua \
            client-addons-src/GroupComposer/DashboardV4.lua \
            client-addons-src/GroupComposer/tests/test_server_contract.py
          git commit -m 'build(group-composer): refresh staged backend contracts'
          git push origin HEAD:test/group-composer-v4
